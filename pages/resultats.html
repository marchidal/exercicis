<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Resultats</title>

    <link rel="stylesheet" href="../css/resultats.css">
</head>

<body>

    <main class="resultats-container">

        <!-- =========================
             CAPÇALERA
             ========================= -->

        <header class="resultats-header">

            <a href="../index.html" class="boto-tornar">
                <span aria-hidden="true">←</span>
                Inici
            </a>

            <h1>Resultats</h1>

        </header>


        <!-- =========================
             PERFIL DE L'ALUMNE
             ========================= -->

        <section class="perfil-alumne">

            <div class="perfil-info">

                <h2 id="nom-alumne">
                    Alumne
                </h2>

                <div class="perfil-dades">

                    <span class="nivell-general">
                        Lv.
                        <strong id="nivell-general">1</strong>
                    </span>

                    <span
                        id="classe-general"
                        class="classe classe-d">
                        Classe D
                    </span>

                </div>

            </div>

        </section>


        <!-- =========================
             PROGRÉS PER CATEGORIES
             ========================= -->
        
        <section class="categories">
        
            <h2>Progrés</h2>
        
        
            <!-- =========================
                 NOTES
                 ========================= -->
        
            <article
                class="categoria"
                data-categoria="notes">
        
                <div class="categoria-header">
        
                    <h3>Notes</h3>
        
                    <div class="categoria-dades">
        
                        <span
                            id="classe-notes"
                            class="classe-mini classe-d">
                            D
                        </span>
        
                        <span class="categoria-nivell">
                            Lv.
                            <strong id="nivell-notes">1</strong>
                        </span>
        
                    </div>
        
                </div>
        
        
                <div class="barra-experiencia">
        
                    <div
                        id="barra-notes"
                        class="barra-progres"
                        style="width: 0%;">
                    </div>
        
                    <span class="text-xp">
                        <span id="xp-notes">0</span>
                        /
                        <span id="xp-next-notes">50</span>
                        XP
                    </span>
        
                </div>
        
            </article>
        
        
            <!-- =========================
                 LLENGUATGE
                 ========================= -->
        
            <article
                class="categoria"
                data-categoria="llenguatge">
        
                <div class="categoria-header">
        
                    <h3>Llenguatge</h3>
        
                    <div class="categoria-dades">
        
                        <span
                            id="classe-llenguatge"
                            class="classe-mini classe-d">
                            D
                        </span>
        
                        <span class="categoria-nivell">
                            Lv.
                            <strong id="nivell-llenguatge">1</strong>
                        </span>
        
                    </div>
        
                </div>
        
        
                <div class="barra-experiencia">
        
                    <div
                        id="barra-llenguatge"
                        class="barra-progres"
                        style="width: 0%;">
                    </div>
        
                    <span class="text-xp">
                        <span id="xp-llenguatge">0</span>
                        /
                        <span id="xp-next-llenguatge">50</span>
                        XP
                    </span>
        
                </div>
        
            </article>
        
        
            <!-- =========================
                 DICTAT RÍTMIC
                 ========================= -->
        
            <article
                class="categoria"
                data-categoria="dictat-ritmic">
        
                <div class="categoria-header">
        
                    <h3>Dictat rítmic</h3>
        
                    <div class="categoria-dades">
        
                        <span
                            id="classe-dictat-ritmic"
                            class="classe-mini classe-d">
                            D
                        </span>
        
                        <span class="categoria-nivell">
                            Lv.
                            <strong id="nivell-dictat-ritmic">1</strong>
                        </span>
        
                    </div>
        
                </div>
        
        
                <div class="barra-experiencia">
        
                    <div
                        id="barra-dictat-ritmic"
                        class="barra-progres"
                        style="width: 0%;">
                    </div>
        
                    <span class="text-xp">
                        <span id="xp-dictat-ritmic">0</span>
                        /
                        <span id="xp-next-dictat-ritmic">50</span>
                        XP
                    </span>
        
                </div>
        
            </article>
        
        
            <!-- =========================
                 DICTAT MELÒDIC
                 ========================= -->
        
            <article
                class="categoria"
                data-categoria="dictat-melodic">
        
                <div class="categoria-header">
        
                    <h3>Dictat melòdic</h3>
        
                    <div class="categoria-dades">
        
                        <span
                            id="classe-dictat-melodic"
                            class="classe-mini classe-d">
                            D
                        </span>
        
                        <span class="categoria-nivell">
                            Lv.
                            <strong id="nivell-dictat-melodic">1</strong>
                        </span>
        
                    </div>
        
                </div>
        
        
                <div class="barra-experiencia">
        
                    <div
                        id="barra-dictat-melodic"
                        class="barra-progres"
                        style="width: 0%;">
                    </div>
        
                    <span class="text-xp">
                        <span id="xp-dictat-melodic">0</span>
                        /
                        <span id="xp-next-dictat-melodic">50</span>
                        XP
                    </span>
        
                </div>
        
            </article>
        
        </section>


        <!-- =========================
             EXPERIÈNCIA TOTAL
             ========================= -->

        <section class="experiencia-total">

            <h2>Experiència total</h2>

            <p>
                <strong id="xp-total">0</strong>
                XP
            </p>

        </section>

    </main>


    <!-- =========================
         JAVASCRIPT
         ========================= -->

    <script src="../js/dades-exercicis.js"></script>
    <script src="../js/resultats.js"></script>

</body>

</html>
